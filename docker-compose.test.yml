services:
  express:
    container_name: express
    environment:
      NODE_ENV: test
      MONGODB_URL: mongodb://test:test@dbdata:27017/test-db?authSource=admin
      REDIS_DB: 1
    command: yarn test
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
  dbdata:
    environment:
      MONGO_INITDB_ROOT_USERNAME: test
      MONGO_INITDB_ROOT_PASSWORD: test
    volumes:
      - mongo-data-test:/data/db

  redis:
    command:
      - redis-server
      - --save
      - ''
      - --appendonly
      - 'no'

volumes:
  mongo-data-test:
